<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Church Atlas — Dünya Kilise Mirası Haritası</title>
<meta name="description" content="Dünya çapındaki kilise mirasını, mimarisini ve tarihini haritalayan, belgeleyen ve arşivleyen açık katılımlı platform.">
<link rel="canonical" href="https://thechurchatlas.com/">
<meta property="og:title" content="The Church Atlas — Dünya Kilise Mirası Haritası">
<meta property="og:description" content="Kilise mirasını, mimarisini ve tarihini keşfedin; fotoğraf ve bilgi katkısı yapın.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thechurchatlas.com/">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#f8f9fa}
#map{width:100%;height:100%;position:absolute;top:0;left:0;z-index:1}
.header-container{position:absolute;top:16px;left:16px;right:16px;max-width:420px;z-index:1000;display:flex;flex-direction:column;gap:10px}
.header-card{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 18px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);border:1px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:1rem;font-weight:700;color:#1e293b}
.header-actions{display:flex;gap:8px;align-items:center}
.header-badge{background:#e2e8f0;color:#475569;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:20px}
.admin-btn{background:#0f172a;color:#fff;border:none;font-size:.75rem;font-weight:600;padding:5px 10px;border-radius:8px;cursor:pointer}
.search-box{width:100%;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);border:1px solid rgba(255,255,255,.6);font-size:.9rem;color:#1e293b;outline:none}
#status-box{position:absolute;bottom:24px;left:16px;z-index:1000;background:rgba(15,23,42,.85);backdrop-filter:blur(8px);color:#f8fafc;padding:8px 14px;border-radius:8px;font-size:.825rem;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block}
#info-drawer{position:absolute;bottom:-100%;left:0;width:100%;z-index:2000;background:rgba(255,255,255,.98);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -10px 30px rgba(0,0,0,.15);border-top:1px solid rgba(255,255,255,.8);padding:24px 24px 36px;transition:bottom .3s cubic-bezier(.16,1,.3,1);max-height:85vh;overflow-y:auto}
#info-drawer.active{bottom:0}
.drawer-close{position:absolute;top:18px;right:20px;background:#f1f5f9;border:none;width:32px;height:32px;border-radius:50%;font-size:1rem;cursor:pointer;color:#64748b;display:flex;align-items:center;justify-content:center;z-index:10}
.drawer-img-container{width:100%;height:160px;border-radius:12px;overflow:hidden;margin-bottom:12px;background:#e2e8f0;display:flex;align-items:center;justify-content:center}
.drawer-img{width:100%;height:100%;object-fit:cover}
.drawer-header-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.drawer-title{margin:0;font-size:1.2rem;font-weight:700;color:#0f172a}
.denomination-badge{font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:12px;text-transform:uppercase}
.badge-katolik{background:#fee2e2;color:#991b1b}
.badge-anglikan{background:#e0e7ff;color:#3730a3}
.badge-protestan{background:#dcfce7;color:#166534}
.drawer-location{margin:0 0 10px;font-size:.85rem;color:#64748b;font-weight:500}
.drawer-desc{margin:0 0 16px;font-size:.9rem;color:#334155;line-height:1.5}
.comment{font-size:.825rem;margin-top:6px;padding:8px;background:#f1f5f9;border-radius:6px}
.contrib-section{border-top:1px solid #e2e8f0;padding-top:16px;margin-top:16px}
.contrib-title{font-size:.9rem;font-weight:600;color:#1e293b;margin-bottom:10px}
.contrib-input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:.85rem;margin-bottom:8px;outline:none}
.contrib-input:focus{border-color:#3b82f6}
.contrib-submit{background:#2563eb;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;width:100%}
#admin-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;align-items:center;justify-content:center;padding:16px}
.modal-content{background:#fff;width:100%;max-width:450px;padding:24px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,.2);max-height:80vh;overflow-y:auto;position:relative}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.pending-item{background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:8px;margin-bottom:10px}
.pending-actions{display:flex;gap:8px;margin-top:8px}
.btn-approve{background:#22c55e;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:600}
.btn-reject{background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:600}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:.85rem;font-weight:500;z-index:4000;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="header-container">
  <div class="header-card">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:1.2rem">⛪</span>
      <span class="header-title">The Church Atlas</span>
    </div>
    <div class="header-actions">
      <span id="church-count-badge" class="header-badge"></span>
      <button class="admin-btn" id="admin-btn" hidden>Yönetici</button>
    </div>
  </div>
  <input type="search" id="search-input" class="search-box" placeholder="Kilise, bölge veya mezhep ara..." aria-label="Kilise ara">
</div>

<div id="map" aria-label="Kilise haritası"></div>

<div id="status-box">
  <span class="status-dot"></span>
  <span id="status-text">Wikipedia / Wikidata görsel entegrasyonu aktif</span>
</div>

<div id="info-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-name">
  <button class="drawer-close" id="drawer-close" aria-label="Kapat">✕</button>
  <div class="drawer-img-container"><img id="drawer-img" class="drawer-img" alt=""></div>
  <div class="drawer-header-row">
    <h2 id="drawer-name" class="drawer-title"></h2>
    <span id="drawer-badge" class="denomination-badge"></span>
  </div>
  <p id="drawer-loc" class="drawer-location"></p>
  <div id="drawer-description" class="drawer-desc"></div>
  <div class="contrib-section">
    <div class="contrib-title">💬 Fotoğraf / Yorum Ekle</div>
    <input type="text" id="contrib-name" class="contrib-input" placeholder="Adınız Soyadınız" autocomplete="name">
    <input type="url" id="contrib-photo" class="contrib-input" placeholder="Fotoğraf bağlantısı (https://...)" inputmode="url">
    <textarea id="contrib-comment" class="contrib-input" placeholder="Yorumunuz veya ek bilgi..." rows="2" style="resize:none"></textarea>
    <button class="contrib-submit" id="contrib-submit">Onaya Gönder</button>
  </div>
</div>

<div id="admin-modal" role="dialog" aria-modal="true" aria-labelledby="admin-title">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="admin-title" style="margin:0;font-size:1.1rem;font-weight:700">🛡️ Yönetici Onay Havuzu</h3>
      <button class="drawer-close" style="position:static" id="admin-close" aria-label="Kapat">✕</button>
    </div>
    <div id="pending-list"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
const toastEl=$('toast');let toastTimer;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2800)}

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(console.error))}

const map=L.map('map',{zoomControl:false}).setView([38.4192,27.1428],13);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
setTimeout(()=>map.invalidateSize(),300);

const churchesData=[
 {id:1,wikidataId:'Q54413070',wikiTitle:{tr:'Aziz Polikarp Kilisesi',en:'Saint Polycarp Church'},name:'İzmir St. Polycarp Kilisesi',city:'İzmir',country:'Türkiye',denomination:'Katolik',badgeClass:'badge-katolik',image:'',description:'İzmir’in ayakta kalan en eski Katolik kiliselerinden biridir.',lat:38.4256,lng:27.1357,comments:[]},
 {id:2,wikidataId:'',wikiTitle:null,name:'Alsancak Aziz Yuhanna Anglican Kilisesi',city:'İzmir',country:'Türkiye',denomination:'Anglikan',badgeClass:'badge-anglikan',image:'',description:'19. yüzyıldan kalma tarihi İngiliz Anglikan kilisesidir.',lat:38.4342,lng:27.1415,comments:[]},
 {id:3,wikidataId:'',wikiTitle:null,name:'İzmir Aziz Rozary Katolik Kilisesi',city:'İzmir',country:'Türkiye',denomination:'Katolik',badgeClass:'badge-katolik',image:'',description:'Alsancak bölgesinde yer alan tarihi Katolik ibadethanedir.',lat:38.4320,lng:27.1440,comments:[]},
 {id:4,wikidataId:'',wikiTitle:null,name:'İzmir Protestan Kilisesi',city:'İzmir',country:'Türkiye',denomination:'Protestan',badgeClass:'badge-protestan',image:'',description:'İzmir’deki aktif Protestan cemaatinin ibadet noktalarından biridir.',lat:38.4410,lng:27.1480,comments:[]}
];

const PLACEHOLDER="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='1.5'><rect width='18' height='18' x='3' y='3' rx='2' ry='2'/><circle cx='9' cy='9' r='2'/><path d='m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21'/></svg>";
let markers=[],activeChurchId=null;
let pendingContributions=JSON.parse(localStorage.getItem('pendingContributions')||'[]');

async function getWikipediaImage(wikiTitle){
 if(!wikiTitle)return null;
 const langs=wikiTitle.en?['tr','en']:['tr'];
 for(const lang of langs){
  const title=wikiTitle[lang];
  if(!title)continue;
  try{
   const url='https://'+lang+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title.replaceAll(' ','_'));
   const res=await fetch(url);
   if(!res.ok)continue;
   const data=await res.json();
   const src=data?.originalimage?.source||data?.thumbnail?.source;
   if(src)return src;
  }catch{}
 }
 return null;
}

async function getWikidataImage(qid){
 if(!qid)return null;
 try{
  const url='https://www.wikidata.org/w/api.php?action=wbgetclaims&format=json&origin=*&ids='+encodeURIComponent(qid)+'&property=P18';
  const res=await fetch(url);
  if(!res.ok)return null;
  const data=await res.json();
  const file=data?.claims?.P18?.[0]?.mainsnak?.datavalue?.value;
  if(!file)return null;
  return 'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(file.replaceAll(' ','_'))+'?width=800';
 }catch{return null}
}

async function resolveChurchImage(c){
 return c.image||await getWikipediaImage(c.wikiTitle)||await getWikidataImage(c.wikidataId)||PLACEHOLDER;
}

function renderMarkers(data){
 markers.forEach(m=>map.removeLayer(m));markers=[];
 data.forEach(c=>{
  const marker=L.marker([c.lat,c.lng]).addTo(map);
  marker.on('click',()=>openChurch(c));
  markers.push(marker);
 });
 $('church-count-badge').textContent=data.length+' Kilise';
 if(data.length)map.fitBounds(L.featureGroup(markers).getBounds(),{padding:[40,40],maxZoom:15});
}

async function openChurch(c){
 activeChurchId=c.id;
 const img=$('drawer-img');
 img.onerror=()=>img.src=PLACEHOLDER;
 img.alt=c.name+' görseli';
 img.src=PLACEHOLDER;

 resolveChurchImage(c).then(url=>{
  if(activeChurchId===c.id)img.src=url;
 });

 $('drawer-name').textContent=c.name;
 const badge=$('drawer-badge');badge.textContent=c.denomination;badge.className='denomination-badge '+c.badgeClass;
 $('drawer-loc').textContent=c.city+', '+c.country;
 const desc=$('drawer-description');desc.textContent=c.description;
 if(c.comments?.length){
  const h=document.createElement('strong');h.textContent='Ziyaretçi Yorumları:';
  desc.append(document.createElement('br'),document.createElement('br'),h);
  c.comments.forEach(cm=>{
   const d=document.createElement('div');d.className='comment';
   const a=document.createElement('strong');a.textContent=cm.name;
   d.append('💬 ',a,': ',cm.text);desc.append(d);
  });
 }
 $('info-drawer').classList.add('active');
 map.setView([c.lat,c.lng],15,{animate:true});
}

$('search-input').addEventListener('input',e=>{
 const q=e.target.value.trim().toLowerCase();
 const filtered=!q?churchesData:churchesData.filter(c=>[c.name,c.city,c.denomination,c.description].some(v=>v.toLowerCase().includes(q)));
 renderMarkers(filtered);
});

$('drawer-close').addEventListener('click',()=>$('info-drawer').classList.remove('active'));
map.on('click',()=>$('info-drawer').classList.remove('active'));

function safeImageUrl(v){
 try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}
}

$('contrib-submit').addEventListener('click',()=>{
 const name=$('contrib-name').value.trim(),photo=$('contrib-photo').value.trim(),comment=$('contrib-comment').value.trim();
 if(!name||!comment)return toast('Lütfen adınızı ve yorumunuzu doldurun.');
 if(photo&&!safeImageUrl(photo))return toast('Fotoğraf bağlantısı https:// ile başlamalı.');
 const church=churchesData.find(c=>c.id===activeChurchId);
 pendingContributions.push({id:Date.now(),churchName:church?.name||'Kilise',churchId:activeChurchId,name,photo:safeImageUrl(photo)||'',comment});
 localStorage.setItem('pendingContributions',JSON.stringify(pendingContributions));
 ['contrib-name','contrib-photo','contrib-comment'].forEach(i=>$(i).value='');
 $('info-drawer').classList.remove('active');
 toast('Katkınız yerel onay kuyruğuna eklendi.');
});

function renderPending(){
 const list=$('pending-list');
 if(!pendingContributions.length){list.textContent='Onay bekleyen katkı bulunmuyor.';return}
 list.replaceChildren();
 pendingContributions.forEach(item=>{
  const box=document.createElement('div');box.className='pending-item';
  const church=document.createElement('div');church.style.cssText='font-size:.8rem;font-weight:700;color:#2563eb';church.textContent='⛪ '+item.churchName;
  const body=document.createElement('div');body.style.cssText='font-size:.85rem;margin:4px 0';
  const author=document.createElement('strong');author.textContent=item.name;
  body.append(author,': ',item.comment);
  box.append(church,body);
  if(item.photo){const p=document.createElement('div');p.style.cssText='font-size:.75rem;color:#64748b;word-break:break-all;margin-top:4px';p.textContent='📷 Önerilen resim: '+item.photo;box.append(p)}
  const actions=document.createElement('div');actions.className='pending-actions';
  const approve=document.createElement('button');approve.className='btn-approve';approve.textContent='Onayla';
  approve.addEventListener('click',()=>approveItem(item.id));
  const reject=document.createElement('button');reject.className='btn-reject';reject.textContent='Reddet';
  reject.addEventListener('click',()=>rejectItem(item.id));
  actions.append(approve,reject);box.append(actions);list.append(box);
 });
}

function openAdmin(){renderPending();$('admin-modal').style.display='flex'}
function closeAdmin(){$('admin-modal').style.display='none'}
$('admin-btn').addEventListener('click',openAdmin);
$('admin-close').addEventListener('click',closeAdmin);
$('admin-modal').addEventListener('click',e=>{if(e.target.id==='admin-modal')closeAdmin()});

function approveItem(id){
 const i=pendingContributions.findIndex(p=>p.id===id);if(i<0)return;
 const item=pendingContributions[i],church=churchesData.find(c=>c.id===item.churchId);
 if(church){church.comments.push({name:item.name,text:item.comment});if(item.photo)church.image=item.photo}
 pendingContributions.splice(i,1);localStorage.setItem('pendingContributions',JSON.stringify(pendingContributions));
 renderPending();renderMarkers(churchesData);toast('Katkı yerel olarak onaylandı.');
}
function rejectItem(id){
 const i=pendingContributions.findIndex(p=>p.id===id);if(i<0)return;
 pendingContributions.splice(i,1);localStorage.setItem('pendingContributions',JSON.stringify(pendingContributions));
 renderPending();toast('Katkı reddedildi.');
}

if(location.hostname==='localhost'||location.hostname==='127.0.0.1')$('admin-btn').hidden=false;

renderMarkers(churchesData);
</script>
</body>
</html>
