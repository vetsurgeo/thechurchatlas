<style>
*{box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#f8f9fa}

.header-container{position:absolute;top:16px;left:16px;right:16px;max-width:420px;z-index:1000;display:flex;flex-direction:column;gap:10px}

.admin-btn{background:#0f172a;color:#fff;border:none;font-size:.75rem;font-weight:600;padding:5px 10px;border-radius:8px;cursor:pointer}
.search-box{width:100%;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);border:1px solid rgba(255,255,255,.6);font-size:.9rem;color:#1e293b;outline:none}

.drawer-img{width:100%;height:100%;object-fit:cover}
.img-credit{font-size:.7rem;color:#94a3b8;margin:0 0 10px 2px;min-height:1em}
.drawer-header-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.drawer-title{margin:0;font-size:1.2rem;font-weight:700;color:#0f172a}
.denomination-badge{font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:12px;text-transform:uppercase}
.badge-katolik{background:#fee2e2;color:#991b1b}

.contrib-input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:.85rem;margin-bottom:8px;outline:none}
.contrib-input:focus{border-color:#3b82f6}
.contrib-submit{background:#2563eb;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;width:100%}
.contrib-submit:disabled{opacity:.6;cursor:default}
#admin-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;align-items:center;justify-content:center;padding:16px}
.modal-content{background:#fff;width:100%;max-width:450px;padding:24px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,.2);max-height:80vh;overflow-y:auto;position:relative}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.pending-item{background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:8px;margin-bottom:10px}
.pending-actions{display:flex;gap:8px;margin-top:8px}
.btn-approve{background:#22c55e;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:600}
.btn-reject{background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:600}
.muted{color:#64748b;font-size:.9rem}
.err{color:#ef4444;font-size:.8rem;margin:8px 0 0}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:.85rem;font-weight:500;z-index:4000;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<body>
<div class="header-container">

<div id="admin-modal" role="dialog" aria-modal="true" aria-labelledby="admin-title">

</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================
   AYARLAR — Supabase > Project Settings > API sayfasından kopyala.
   Yalnızca publishable (anon) anahtarı yaz. secret / service_role ASLA.
   ========================================================== */
const SUPABASE_URL='https://siucplaufmjhqgdtorhf.supabase.co';
const SUPABASE_KEY='sb_publishable_Tqo_SWkmm1DhgsaZfiSIIQ_Wa5RfRLi';

const sb=/BURAYA/.test(SUPABASE_URL+SUPABASE_KEY)?null:supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
const toastEl=$('toast');let toastTimer;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),3000)}
function setStatus(text,state){
  $('status-text').textContent=text;
  $('status-dot').style.background=state==='error'?'#ef4444':state==='loading'?'#f59e0b':'#22c55e';
}
function safeParse(json,fallback){try{return JSON.parse(json)??fallback}catch{return fallback}}
function safeImageUrl(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:null}catch{return null}}

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(console.error))}

/* ---------------- Harita ---------------- */
const map=L.map('map',{zoomControl:false}).setView([38.4192,27.1428],13);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
setTimeout(()=>map.invalidateSize(),300);

/* ==========================================================
   GÖRSEL ÇÖZÜMLEME
   Öncelik: 1) onaylı kullanıcı fotoğrafı
            2) Wikidata (wikidata kimliği varsa)
            3) Wikipedia (kesin başlık, yoksa dikkatli arama)
            4) sabit simge
   ========================================================== */
const PLACEHOLDER="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='1.5'><rect width='18' height='18' x='3' y='3' rx='2' ry='2'/><circle cx='9' cy='9' r='2'/><path d='m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21'/></svg>";

const UI_LANG=(navigator.language||'tr').slice(0,2).toLowerCase();
const WIKI_LANGS=[...new Set(['tr',UI_LANG,'en'])];

const CACHE_KEY='autoImageCache_v2';
const TTL_FOUND=30*24*3600*1000, TTL_MISSING=3*24*3600*1000;
let autoCache=safeParse(localStorage.getItem(CACHE_KEY),{});
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(autoCache))}catch{}}

async function fetchJSON(url){
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),6000);
  try{const r=await fetch(url,{signal:ctrl.signal});return r.ok?await r.json():null}
  catch{return null}finally{clearTimeout(t)}
}

const GENERIC=new Set(['kilise','kilisesi','church','katolik','anglikan','anglican','catholic','protestan','protestant','aziz','saint','the','of','and','ve','izmir','turkiye','turkey']);
function tokens(text){
  return String(text||'').toLocaleLowerCase('tr').replace(/ı/g,'i').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!GENERIC.has(w));
}
const CHURCH_RE=/kilise|church|cathedral|katedral|bazilika|basilica|chapel|şapel|sapel/i;
function relevant(church,page){
  const wanted=tokens(church.name);if(!wanted.length)return false;
  const found=new Set(tokens(page.title));
  return wanted.some(w=>found.has(w))&&(CHURCH_RE.test(page.title||'')||CHURCH_RE.test(page.description||''));
}

async function wikidataImage(qid){
  const d=await fetchJSON('https://www.wikidata.org/w/api.php?action=wbgetentities&props=claims&format=json&origin=*&ids='+encodeURIComponent(qid));
  const file=d?.entities?.[qid]?.claims?.P18?.[0]?.mainsnak?.datavalue?.value;
  return file?'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(file)+'?width=800':null;
}

async function wikipediaImage(church,lang){
  const base='https://'+lang+'.wikipedia.org/w/api.php';
  const common='&prop=pageimages|description&piprop=thumbnail&pithumbsize=800&format=json&origin=*';
  const exact=church.wikiTitles?.[lang];
  const url=exact
    ?base+'?action=query&redirects=1&titles='+encodeURIComponent(exact)+common
    :base+'?action=query&generator=search&gsrlimit=3&gsrsearch='+encodeURIComponent(church.name)+common;
  const pages=(await fetchJSON(url))?.query?.pages;if(!pages)return null;
  const list=Object.values(pages).sort((a,b)=>(a.index||0)-(b.index||0));
  for(const p of list){if(p.thumbnail&&(exact||relevant(church,p)))return p.thumbnail.source}
  return null;
}

async function findAutoImage(c){
  if(c.wikidata){const u=await wikidataImage(c.wikidata);if(u)return u}
  for(const lang of WIKI_LANGS){const u=await wikipediaImage(c,lang);if(u)return u}
  return null;
}

async function resolveChurchImage(c){
  if(c.userImage&&safeImageUrl(c.userImage))return{url:c.userImage,source:'user'};
  const sig=(c.wikidata||'')+'|'+JSON.stringify(c.wikiTitles||{});
  const hit=autoCache[c.id];
  if(hit&&hit.sig===sig){
    const age=Date.now()-hit.t;
    if(hit.url&&age<TTL_FOUND)return{url:hit.url,source:'wiki'};
    if(!hit.url&&age<TTL_MISSING)return{url:null,source:null};
  }
  const url=await findAutoImage(c);
  autoCache[c.id]={url,t:Date.now(),sig};saveCache();
  return{url,source:url?'wiki':null};
}

/* ==========================================================
   VERİ (Supabase)
   ========================================================== */
let churchesData=[],markers=[],activeChurchId=null;
const DENOM={Katolik:'badge-katolik',Anglikan:'badge-anglikan',Protestan:'badge-protestan'};

async function loadChurches(){
  if(!sb){setStatus('Supabase ayarları eksik (SUPABASE_URL / SUPABASE_KEY)','error');$('church-count-badge').textContent='0 Kilise';return}
  setStatus('Kiliseler yükleniyor...','loading');
  const [cr,kr]=await Promise.all([
    sb.from('atlas_churches').select('*').order('id'),
    sb.from('atlas_contributions').select('church_id,name,comment,photo_url,created_at').eq('status','approved').order('created_at')
  ]);
  if(cr.error){setStatus('Veri alınamadı: '+cr.error.message,'error');return}
  const approved=kr.data||[];
  churchesData=cr.data.map(c=>{
    const mine=approved.filter(x=>x.church_id===c.id);
    const photos=mine.filter(x=>x.photo_url);
    return{
      id:c.id,name:c.name,city:c.city||'',country:c.country||'',
      denomination:c.denomination,badgeClass:DENOM[c.denomination]||'badge-diger',
      description:c.description||'',lat:c.lat,lng:c.lng,
      wikidata:c.wikidata||'',wikiTitles:c.wiki_titles||{},
      userImage:photos.length?photos[photos.length-1].photo_url:null,
      comments:mine.filter(x=>x.comment).map(x=>({name:x.name,text:x.comment}))
    };
  });
  applyFilter(true);
  setStatus('Wikipedia / Wikidata görsel entegrasyonu aktif','ok');
}

/* ==========================================================
   ARAYÜZ
   ========================================================== */
function renderMarkers(data,fit){
  markers.forEach(m=>map.removeLayer(m));markers=[];
  data.forEach(c=>{
    const m=L.marker([c.lat,c.lng]).addTo(map);
    m.on('click',()=>openChurch(c));
    markers.push(m);
  });
  $('church-count-badge').textContent=data.length+' Kilise';
  if(fit&&data.length)map.fitBounds(L.featureGroup(markers).getBounds(),{padding:[40,40],maxZoom:15});
}

function applyFilter(fit){
  const q=$('search-input').value.trim().toLowerCase();
  const list=!q?churchesData:churchesData.filter(c=>[c.name,c.city,c.denomination,c.description].some(v=>v.toLowerCase().includes(q)));
  renderMarkers(list,fit);
}
$('search-input').addEventListener('input',()=>applyFilter(true));

function setDrawerImage(url,source){
  const img=$('drawer-img');
  img.onerror=()=>{img.onerror=null;img.src=PLACEHOLDER;$('drawer-credit').textContent=''};
  img.src=url||PLACEHOLDER;
  $('drawer-credit').textContent=source==='wiki'?'Görsel: Wikipedia / Wikimedia Commons':source==='user'?'Görsel: Ziyaretçi katkısı':'';
}

function openChurch(c){
  activeChurchId=c.id;
  $('drawer-img').alt=c.name+' görseli';
  setDrawerImage(null,null);
  resolveChurchImage(c).then(r=>{if(activeChurchId===c.id&&r.url)setDrawerImage(r.url,r.source)});

  $('drawer-name').textContent=c.name;
  const badge=$('drawer-badge');badge.textContent=c.denomination;badge.className='denomination-badge '+c.badgeClass;
  $('drawer-loc').textContent=[c.city,c.country].filter(Boolean).join(', ');
  const desc=$('drawer-description');desc.textContent=c.description;
  if(c.comments.length){
    const h=document.createElement('strong');h.textContent='Ziyaretçi Yorumları:';
    desc.append(document.createElement('br'),document.createElement('br'),h);
    c.comments.forEach(cm=>{
      const d=document.createElement('div');d.className='comment';
      const a=document.createElement('strong');a.textContent=cm.name;
      d.append('💬 ',a,': ',cm.text);desc.append(d);
    });
  }
  $('info-drawer').classList.add('active');
  map.setView([c.lat,c.lng],15,{animate:true});
}

$('drawer-close').addEventListener('click',()=>$('info-drawer').classList.remove('active'));
map.on('click',()=>$('info-drawer').classList.remove('active'));

/* ---------------- Katkı gönderme (herkes) ---------------- */
$('contrib-submit').addEventListener('click',async()=>{
  const name=$('contrib-name').value.trim(),photo=$('contrib-photo').value.trim(),comment=$('contrib-comment').value.trim();
  if(!sb)return toast('Supabase ayarları eksik.');
  if(!activeChurchId)return toast('Önce haritadan bir kilise seçin.');
  if(!name||!comment)return toast('Lütfen adınızı ve yorumunuzu doldurun.');
  if(photo&&!safeImageUrl(photo))return toast('Fotoğraf bağlantısı https:// ile başlamalı.');
  const btn=$('contrib-submit');btn.disabled=true;
  const{error}=await sb.from('atlas_contributions').insert({church_id:activeChurchId,name,comment,photo_url:photo||null});
  btn.disabled=false;
  if(error)return toast('Gönderilemedi: '+error.message);
  ['contrib-name','contrib-photo','contrib-comment'].forEach(i=>$(i).value='');
  $('info-drawer').classList.remove('active');
  toast('Katkınız yönetici onayına gönderildi. Teşekkürler!');
});

/* ---------------- Yönetici (Supabase Auth) ---------------- */
// Buton herkese gösterilmez: adresin sonuna #admin eklenince görünür.
function syncAdminBtn(){$('admin-btn').hidden=location.hash!=='#admin'}
addEventListener('hashchange',syncAdminBtn);syncAdminBtn();

async function openAdmin(){
  $('admin-modal').style.display='flex';
  if(!sb){showLogin();$('admin-login-msg').textContent='Supabase ayarları eksik.';return}
  const{data}=await sb.auth.getSession();
  data?.session?showPanel():showLogin();
}
function closeAdmin(){$('admin-modal').style.display='none'}
function showLogin(){$('admin-login').hidden=false;$('admin-panel').hidden=true}
async function showPanel(){$('admin-login').hidden=true;$('admin-panel').hidden=false;await refreshPending()}

$('admin-btn').addEventListener('click',openAdmin);
$('admin-close').addEventListener('click',closeAdmin);
$('admin-modal').addEventListener('click',e=>{if(e.target.id==='admin-modal')closeAdmin()});

$('admin-login-btn').addEventListener('click',async()=>{
  const msg=$('admin-login-msg');msg.textContent='';
  if(!sb){msg.textContent='Supabase ayarları eksik.';return}
  const{error}=await sb.auth.signInWithPassword({email:$('admin-email').value.trim(),password:$('admin-pass').value});
  if(error){msg.textContent='Giriş başarısız: '+error.message;return}
  $('admin-pass').value='';showPanel();
});
$('admin-logout').addEventListener('click',async()=>{await sb.auth.signOut();showLogin()});

async function refreshPending(){
  const list=$('pending-list');
  list.textContent='Yükleniyor...';list.className='muted';
  const{data,error}=await sb.from('atlas_contributions')
    .select('id,name,comment,photo_url,created_at,atlas_churches(name)')
    .eq('status','pending').order('created_at');
  if(error){list.textContent='Hata: '+error.message;list.className='err';return}
  if(!data.length){list.textContent='Onay bekleyen katkı bulunmuyor.';return}
  list.className='';list.replaceChildren();
  data.forEach(item=>{
    const box=document.createElement('div');box.className='pending-item';
    const church=document.createElement('div');
    church.style.cssText='font-size:.8rem;font-weight:700;color:#2563eb';
    church.textContent='⛪ '+(item.atlas_churches?.name||'Kilise');
    const body=document.createElement('div');body.style.cssText='font-size:.85rem;margin:4px 0';
    const author=document.createElement('strong');author.textContent=item.name;
    body.append(author,': ',item.comment);
    box.append(church,body);
    const photo=item.photo_url&&safeImageUrl(item.photo_url);
    if(photo){
      const p=document.createElement('div');p.style.cssText='font-size:.75rem;color:#64748b;word-break:break-all;margin-top:4px';
      const a=document.createElement('a');a.href=photo;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Linki gör';
      p.append('📷 Önerilen resim: ',a);box.append(p);
    }
    const actions=document.createElement('div');actions.className='pending-actions';
    const ok=document.createElement('button');ok.className='btn-approve';ok.textContent='Onayla';
    ok.addEventListener('click',()=>moderate(item.id,'approved'));
    const no=document.createElement('button');no.className='btn-reject';no.textContent='Reddet';
    no.addEventListener('click',()=>moderate(item.id,'rejected'));
    actions.append(ok,no);box.append(actions);list.append(box);
  });
}

async function moderate(id,status){
  const{data,error}=await sb.from('atlas_contributions').update({status}).eq('id',id).select();
  if(error)return toast('Hata: '+error.message);
  if(!data||!data.length)return toast('İşlem yapılamadı. Yönetici hesabıyla giriş yaptığından emin ol.');
  toast(status==='approved'?'Katkı yayınlandı.':'Katkı reddedildi.');
  await refreshPending();
  if(status==='approved')await loadChurches();
}

loadChurches();
</script>

</html>
